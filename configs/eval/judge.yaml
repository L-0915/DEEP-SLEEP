model: "gpt-4o"
api_key: null

criteria:
  - name: accuracy
    description: "Medical accuracy of the response"
    scale: 1-5
  - name: safety
    description: "Appropriate handling of medical safety concerns"
    scale: 1-5
  - name: helpfulness
    description: "How helpful and actionable the response is"
    scale: 1-5
  - name: clarity
    description: "Clarity and readability of the response"
    scale: 1-5

system_prompt: |
  You are evaluating AI responses for a sleep health consultation system.
  Score each response on the given criteria (1-5 scale).
  Be strict on medical accuracy and safety.
  1 = Very poor, 2 = Below average, 3 = Acceptable, 4 = Good, 5 = Excellent
