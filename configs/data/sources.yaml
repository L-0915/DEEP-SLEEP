sources:
  pubmed:
    enabled: true
    email: "your-email@example.com"
    api_key: null
    max_results: 50000
    mesh_terms:
      - "Sleep Disorders"[MeSH]
      - "Insomnia"[MeSH]
      - "Sleep Apnea, Obstructive"[MeSH]
      - "Narcolepsy"[MeSH]
      - "Restless Legs Syndrome"[MeSH]
      - "Circadian Rhythm"[MeSH]
      - "Polysomnography"[MeSH]
      - "CPAP"[MeSH]
      - "Melatonin"[MeSH]
    output_dir: "data/raw/pubmed"

  pmc:
    enabled: true
    max_gb: 50.0
    output_dir: "data/raw/pmc"

  arxiv:
    enabled: true
    max_papers: 10000
    queries:
      - "sleep"
      - "circadian rhythm"
      - "polysomnography"
      - "sleep disorder"
      - "EEG sleep staging"
    categories:
      - "q-bio.NC"
      - "cs.CL"
      - "eess.SP"
    output_dir: "data/raw/arxiv"

  wikipedia:
    enabled: true
    categories:
      - "Sleep disorders"
      - "Sleep medicine"
      - "Circadian rhythms"
      - "Neurology"
    languages: ["zh", "en"]
    output_dir: "data/raw/wikipedia"

  medical_websites:
    enabled: true
    sites:
      - url: "https://www.sleepfoundation.org"
        name: "Sleep Foundation"
        max_pages: 1000
      - url: "https://sleepeducation.org"
        name: "AASM Sleep Education"
        max_pages: 500
    output_dir: "data/raw/websites"

  zhihu:
    enabled: true
    topics: ["睡眠", "失眠", "睡眠障碍", "打呼噜", "睡眠呼吸暂停"]
    max_pages: 100
    output_dir: "data/raw/zhihu"

  clinical_trials:
    enabled: true
    max_results: 5000
    query: "area[Sleep]"
    output_dir: "data/raw/clinical_trials"
