model_config: "configs/model/deepsleep_2b.yaml"

data_dir: "data/tokenized"
seq_length: 8192
global_batch_size: 512
micro_batch_size: 16
gradient_accumulation_steps: 32

optimizer: "adamw_torch"
learning_rate: 3.0e-4
weight_decay: 0.1
adam_beta1: 0.9
adam_beta2: 0.95
adam_epsilon: 1.0e-8
lr_scheduler: "cosine"
warmup_steps: 2000
min_lr_ratio: 0.1

max_steps: 58593
num_train_epochs: null
gradient_clipping: 1.0

dtype: bf16
gradient_accumulation_dtype: fp32

output_dir: "checkpoints/pretrain"
save_steps: 5000
save_total_limit: 5
eval_steps: 10000

logging_steps: 100
wandb:
  enabled: true
  project: "deepsleep"
  run_name: "pretrain-2b"

fsdp:
  enabled: true
  sharding_strategy: "full_shard"
  cpu_offload: false
  backward_prefetch: "backward_pre"
  auto_wrap_policy: "transformer_layer"

resume_from_checkpoint: null
