model_config: "configs/model/deepsleep_2b.yaml"
pretrained_checkpoint: "checkpoints/pretrain/checkpoint-58593"

data_path: "data/sft/train.jsonl"
val_data_path: "data/sft/val.jsonl"
seq_length: 4096
global_batch_size: 128
micro_batch_size: 16

strategy: "full"
lora:
  r: 64
  alpha: 128
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  dropout: 0.05

learning_rate: 2.0e-5
weight_decay: 0.01
lr_scheduler: "cosine"
warmup_steps: 100
num_train_epochs: 3
gradient_clipping: 1.0

dtype: bf16

output_dir: "checkpoints/sft"
save_steps: 500
save_total_limit: 3
eval_steps: 200
logging_steps: 10

wandb:
  enabled: true
  project: "deepsleep"
  run_name: "sft-2b"

generation:
  max_new_tokens: 512
  temperature: 0.7
  top_p: 0.9
  do_sample: true
